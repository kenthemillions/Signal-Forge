<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Signal Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%); min-height: 100vh; color: #e8e8e8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .signup-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
        .btn-primary { background: linear-gradient(135deg, #00d4aa, #00ff88); color: #0f0f1a; border: none; font-weight: 600; }
        .form-control { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .form-control:focus { border-color: #00d4aa; color: #fff; }
        a { color: #00d4aa; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="signup-card p-4 shadow">
                    <h2 class="text-center mb-4"><i class="bi bi-graph-up-arrow text-success"></i> Create Account</h2>
                    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
                    <form method="post" action="{{ url_for('signup_post') }}">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required placeholder="you@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" required placeholder="Choose a username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required minlength="8" placeholder="At least 8 characters">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" name="password_confirm" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Create Account</button>
                    </form>
                    <p class="text-center mt-3 small"><a href="{{ url_for('login_page') }}">Already have an account? Sign in</a></p>
                </div>
                <p class="text-center text-muted small mt-3"><a href="{{ url_for('terms_page') }}">Terms</a> | <a href="{{ url_for('privacy_page') }}">Privacy</a></p>
            </div>
        </div>
    </div>
</body>
</html>
