<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Signal Forge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%); min-height: 100vh; color: #e8e8e8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
        .btn-primary { background: linear-gradient(135deg, #00d4aa, #00ff88); color: #0f0f1a; border: none; font-weight: 600; }
        .btn-primary:hover { background: #00ff88; color: #0f0f1a; }
        .form-control { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .form-control:focus { background: rgba(255,255,255,0.1); border-color: #00d4aa; color: #fff; }
        a { color: #00d4aa; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-card p-4 shadow">
                    <h2 class="text-center mb-4"><i class="bi bi-graph-up-arrow text-success"></i> Signal Forge</h2>
                    <p class="text-center text-muted small mb-4">Sign in to your account</p>
                    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
                    <form method="post" action="{{ url_for('login_post') }}">
                        <input type="hidden" name="next" value="{{ next or '' }}">
                        <div class="mb-3">
                            <label class="form-label">Username or Email</label>
                            <input type="text" class="form-control" name="username" required autofocus placeholder="admin or beta">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
                    </form>
                    <p class="text-center mt-3 small"><a href="{{ url_for('signup_page') }}">Create account</a> &middot; <a href="{{ url_for('landing') }}">Back to home</a></p>
                </div>
                <p class="text-center text-muted small mt-3"><a href="{{ url_for('terms_page') }}">Terms</a> | <a href="{{ url_for('privacy_page') }}">Privacy</a> | <a href="{{ url_for('disclaimer_page') }}">Disclaimer</a></p>
            </div>
        </div>
    </div>
</body>
</html>
